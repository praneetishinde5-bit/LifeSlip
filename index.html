<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌱 Life to 🧾 Receipts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Space Mono', monospace, sans-serif;
    }

    body {
      min-height: 100vh;
      padding: 2.5rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background 0.6s ease, color 0.6s ease;
    }

    body.theme-spotify {
      background: linear-gradient(135deg, #311042 0%, #581c87 50%, #7e22ce 100%);
      color: #f3e8ff;
    }

    body.theme-transactions {
      background: linear-gradient(135deg, #022c22 0%, #065f46 50%, #047857 100%);
      color: #ecfdf5;
    }

    body.theme-custom {
      background: linear-gradient(135deg, #450a0a 0%, #991b1b 50%, #b91c1c 100%);
      color: #fee2e2;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 1.85rem;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
    }

    header p {
      font-size: 0.9rem;
      margin-top: 0.35rem;
      opacity: 0.9;
    }

    .layout {
      display: flex;
      gap: 2rem;
      max-width: 900px;
      width: 100%;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .controls {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      padding: 1.5rem;
      flex: 1;
      min-width: 320px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(10px);
      color: #1e293b;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: #475569;
      margin-bottom: 0.35rem;
      text-transform: uppercase;
    }

    input, select, textarea {
      width: 100%;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      color: #1e293b;
      padding: 0.65rem 0.8rem;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.85rem;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #0f172a;
      box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.1);
    }

    .row-inputs {
      display: flex;
      gap: 0.5rem;
    }

    button {
      width: 100%;
      color: #ffffff;
      border: none;
      padding: 0.8rem;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9rem;
      margin-top: 0.5rem;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .theme-spotify button {
      background: #7e22ce;
    }
    .theme-spotify button:hover {
      background: #6b21a8;
    }

    .theme-transactions button {
      background: #047857;
    }
    .theme-transactions button:hover {
      background: #065f46;
    }

    .theme-custom button {
      background: #b91c1c;
    }
    .theme-custom button:hover {
      background: #991b1b;
    }

    .receipt-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .receipt {
      background: #fffdfa;
      color: #1e293b;
      width: 310px;
      padding: 1.75rem 1.4rem 2rem 1.4rem;
      border: 1px solid #e2e8f0;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
      font-size: 0.8rem;
      line-height: 1.4;
      position: relative;
      transition: background 0.3s ease, color 0.3s ease;
      clip-path: polygon(
        0% 0%, 100% 0%, 100% calc(100% - 8px),
        95% 100%, 90% calc(100% - 8px), 85% 100%, 80% calc(100% - 8px),
        75% 100%, 70% calc(100% - 8px), 65% 100%, 60% calc(100% - 8px),
        55% 100%, 50% calc(100% - 8px), 45% 100%, 40% calc(100% - 8px),
        35% 100%, 30% calc(100% - 8px), 25% 100%, 20% calc(100% - 8px),
        15% 100%, 10% calc(100% - 8px), 5% 100%, 0% calc(100% - 8px)
      );
    }

    .receipt.dark-mode {
      background: #111827;
      color: #f9fafb;
      border: 1px solid #374151;
    }

    .receipt.dark-mode .divider {
      border-top: 1px dashed #4b5563;
    }

    .receipt.dark-mode .receipt-sub,
    .receipt.dark-mode .receipt-meta,
    .receipt.dark-mode .receipt-footer {
      color: #9ca3af;
    }

    .receipt.dark-mode .receipt-title,
    .receipt.dark-mode .total-row,
    .receipt.dark-mode .barcode {
      color: #ffffff;
    }

    .receipt-header {
      text-align: center;
      margin-bottom: 0.8rem;
    }

    .receipt-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      word-break: break-word;
    }

    .receipt-sub {
      font-size: 0.7rem;
      color: #64748b;
      margin-top: 0.2rem;
    }

    .divider {
      border-top: 1px dashed #cbd5e1;
      margin: 0.75rem 0;
    }

    .receipt-meta {
      font-size: 0.7rem;
      color: #475569;
    }

    .receipt-items {
      width: 100%;
      max-height: 180px;
      overflow-y: auto;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.4rem;
      gap: 0.5rem;
    }

    .item-row span:first-child {
      max-width: 190px;
      word-break: break-word;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .receipt-footer {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.7rem;
      color: #64748b;
    }

    .barcode {
      margin-top: 0.5rem;
      letter-spacing: 3px;
      font-size: 1rem;
      font-weight: bold;
      white-space: nowrap;
    }

    .stamp {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-15deg);
      border: 3px solid #ef4444;
      color: #ef4444;
      font-size: 1.2rem;
      font-weight: 700;
      padding: 0.2rem 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.3;
      pointer-events: none;
      display: none;
    }

    .receipt.show-stamp .stamp {
      display: block;
    }
  </style>
</head>
<body class="theme-spotify">

  <header>
    <h1 id="appHeaderTitle">🌱 Life to 🧾 Receipts</h1>
    <p id="appHeaderSub">Turn personal digital moments into receipts.</p>
  </header>

  <div class="layout">
    <div class="controls">
      <div class="form-group">
        <label id="lblLang">Language / भाषा</label>
        <select id="langSelect" onchange="changeLanguage()">
          <option value="en">English</option>
          <option value="hi">हिंदी (Hindi)</option>
          <option value="mr">मराठी (Marathi)</option>
        </select>
      </div>

      <div class="form-group">
        <label id="lblDataset">Select Preset Dataset</label>
        <select id="datasetSelect" onchange="applyPreset()">
          <option value="spotify">Spotify History (Tracks & Plays)</option>
          <option value="transactions">Household Transactions (Expenses)</option>
        </select>
      </div>

      <div class="form-group">
        <label id="lblUpload">Upload Custom CSV</label>
        <input type="file" id="csvFile" accept=".csv" onchange="handleCSV(event)" />
      </div>

      <div class="form-group">
        <label id="lblTitle">Receipt Title</label>
        <input type="text" id="titleInput" value="SPOTIFY REPLAY 2026" oninput="updateReceipt()" />
      </div>

      <div class="form-group">
        <label id="lblCat">Category / Note</label>
        <input type="text" id="catInput" value="Top Rotations & Music Stream" oninput="updateReceipt()" />
      </div>

      <div class="form-group">
        <label id="lblAddItem">Add Item / Moment</label>
        <div class="row-inputs">
          <input type="text" id="newItemName" placeholder="Name" />
          <input type="text" id="newItemVal" placeholder="Val/Time" style="width: 100px;" />
        </div>
        <button onclick="addItem()" style="background: #334155; margin-top: 0.4rem;">+ Add Item</button>
      </div>

      <div class="form-group">
        <label id="lblQuote">Footer Quote</label>
        <textarea id="quoteInput" rows="2" oninput="updateReceipt()">Thank you for keeping the rhythm alive.</textarea>
      </div>

      <div class="form-group" style="display: flex; gap: 1rem; align-items: center;">
        <label style="cursor: pointer; display: flex; align-items: center; gap: 0.4rem;">
          <input type="checkbox" id="darkModeToggle" onchange="toggleDarkMode()" style="width: auto;" /> Dark Receipt Paper
        </label>
        <label style="cursor: pointer; display: flex; align-items: center; gap: 0.4rem;">
          <input type="checkbox" id="stampToggle" onchange="toggleStamp()" style="width: auto;" /> Verified Stamp
        </label>
      </div>

      <button id="btnDownload" onclick="downloadReceipt()">Download Receipt (PNG)</button>
    </div>

    <div class="receipt-container">
      <div class="receipt" id="receiptCard">
        <div class="stamp" id="receiptStamp">VERIFIED</div>
        <div class="receipt-header">
          <div class="receipt-title" id="rTitle">SPOTIFY REPLAY 2026</div>
          <div class="receipt-sub" id="rCat">Top Rotations & Music Stream</div>
        </div>

        <div class="divider"></div>

        <div class="receipt-meta">
          <div><span id="rDateLabel">DATE: </span><span id="rDate"></span></div>
          <div id="rTerminal">TERMINAL: Localhost Client</div>
        </div>

        <div class="divider"></div>

        <div class="receipt-items" id="receiptItems"></div>

        <div class="divider"></div>

        <div class="total-row">
          <span id="rTotalLabel">TOTAL TIME</span>
          <span id="rTotalVal">21.6 mins</span>
        </div>

        <div class="divider"></div>

        <div class="receipt-footer">
          <p id="rQuote">Thank you for keeping the rhythm alive.</p>
          <div class="barcode">|||| | || |||| | ||||</div>
        </div>
      </div>
    </div>
  </div>

  <audio id="printSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

  <script>
    const translations = {
      en: {
        headerTitle: "🌱 Life to 🧾 Receipts",
        headerSub: "Turn personal digital moments into receipts.",
        lblLang: "Language / भाषा",
        lblDataset: "Select Preset Dataset",
        lblUpload: "Upload Custom CSV",
        lblTitle: "Receipt Title",
        lblCat: "Category / Note",
        lblAddItem: "Add Item / Moment",
        lblQuote: "Footer Quote",
        btnDownload: "Download Receipt (PNG)",
        dateLabel: "DATE: ",
        terminal: "TERMINAL: Localhost Client",
        totalTime: "TOTAL TIME",
        totalSpent: "TOTAL SPENT",
        totalItems: "ITEMS",
        spotifyTitle: "SPOTIFY REPLAY 2026",
        spotifyCat: "Top Rotations & Music Stream",
        spotifyQuote: "Thank you for keeping the rhythm alive.",
        txTitle: "HOUSEHOLD EXPENSES",
        txCat: "Daily Transaction Log",
        txQuote: "Invest in memories, not just expenses."
      },
      hi: {
        headerTitle: "🌱 जीवन से 🧾 रसीदें",
        headerSub: "अपने डिजिटल पलों को रसीदों में बदलें।",
        lblLang: "भाषा चुनें",
        lblDataset: "डेटासेट चुनें",
        lblUpload: "कस्टम CSV अपलोड करें",
        lblTitle: "रसीद का शीर्षक",
        lblCat: "श्रेणी / विवरण",
        lblAddItem: "आइटम जोड़ें",
        lblQuote: "फुटर संदेश",
        btnDownload: "रसीद डाउनलोड करें (PNG)",
        dateLabel: "दिनांक: ",
        terminal: "टर्मिनल: लोकलहोस्ट क्लाइंट",
        totalTime: "कुल समय",
        totalSpent: "कुल खर्च",
        totalItems: "आइटम",
        spotifyTitle: "स्पॉटिफ़ाई रीप्ले 2026",
        spotifyCat: "शीर्ष संगीत व ट्रैक सूची",
        spotifyQuote: "संगीत को जीवित रखने के लिए धन्यवाद।",
        txTitle: "घरेलू खर्च विवरण",
        txCat: "दैनिक लेनदेन लॉग",
        txQuote: "यादों में निवेश करें, केवल खर्चों में नहीं।"
      },
      mr: {
        headerTitle: "🌱 जीवन ते 🧾 पावती",
        headerSub: "आपले डिजिटल क्षण पावतीमध्ये रूपांतरित करा.",
        lblLang: "भाषा निवडा",
        lblDataset: "डेटासेट निवडा",
        lblUpload: "सानुकूल CSV अपलोड करा",
        lblTitle: "पावती शीर्षक",
        lblCat: "वर्ग / नोंद",
        lblAddItem: "वस्तू जोडा",
        lblQuote: "खालील संदेश",
        btnDownload: "पावती डाउनलोड करा (PNG)",
        dateLabel: "तारीख: ",
        terminal: "टर्मिनल: लोकलहोस्ट क्लायंट",
        totalTime: "एकूण वेळ",
        totalSpent: "एकूण खर्च",
        totalItems: "वस्तू",
        spotifyTitle: "स्पॉटिफाय रीप्ले २०२६",
        spotifyCat: "आवडती गाणी आणि संगीत",
        spotifyQuote: "संगीताची लय जिवंत ठेवल्याबद्दल धन्यवाद.",
        txTitle: "घरगुती खर्च नोंद",
        txCat: "दैनिक व्यवहार नोंद",
        txQuote: "केवळ खर्चात नाही, आठवणींमध्ये गुंतवणूक करा."
      }
    };

    let activeItems = [];

    const spotifyData = [
      { name: "Starboy - The Weeknd", val: "3:50 min" },
      { name: "Blinding Lights - The Weeknd", val: "3:20 min" },
      { name: "Midnight City - M83", val: "4:03 min" },
      { name: "Sweater Weather - The Neighb.", val: "4:00 min" },
      { name: "As It Was - Harry Styles", val: "2:47 min" },
      { name: "Night Changes - 1D", val: "3:46 min" }
    ];

    const transactionData = [
      { name: "Groceries (Supermarket)", val: "₹ 1,450" },
      { name: "Late Night Food Delivery", val: "₹ 380" },
      { name: "Fuel & Travel", val: "₹ 500" },
      { name: "Monthly Electricity Bill", val: "₹ 1,120" },
      { name: "Cafe & Snacks", val: "₹ 120" }
    ];

    document.getElementById('rDate').innerText = new Date().toLocaleDateString('en-GB');

    function renderItems() {
      const container = document.getElementById('receiptItems');
      container.innerHTML = "";
      activeItems.forEach(item => {
        const div = document.createElement('div');
        div.className = 'item-row';
        div.innerHTML = `<span>${item.name}</span><span>${item.val}</span>`;
        container.appendChild(div);
      });
    }

    function addItem() {
      const name = document.getElementById('newItemName').value.trim();
      const val = document.getElementById('newItemVal').value.trim();
      if (!name) return;
      activeItems.push({ name: name, val: val || "1x" });
      document.getElementById('newItemName').value = "";
      document.getElementById('newItemVal').value = "";
      renderItems();
      document.getElementById('rTotalVal').innerText = activeItems.length + " entries";
    }

    function toggleDarkMode() {
      const isDark = document.getElementById('darkModeToggle').checked;
      const card = document.getElementById('receiptCard');
      if (isDark) {
        card.classList.add('dark-mode');
      } else {
        card.classList.remove('dark-mode');
      }
    }

    function toggleStamp() {
      const show = document.getElementById('stampToggle').checked;
      const card = document.getElementById('receiptCard');
      if (show) {
        card.classList.add('show-stamp');
      } else {
        card.classList.remove('show-stamp');
      }
    }

    function changeLanguage() {
      const lang = document.getElementById('langSelect').value;
      const t = translations[lang];

      document.getElementById('appHeaderTitle').innerText = t.headerTitle;
      document.getElementById('appHeaderSub').innerText = t.headerSub;
      document.getElementById('lblLang').innerText = t.lblLang;
      document.getElementById('lblDataset').innerText = t.lblDataset;
      document.getElementById('lblUpload').innerText = t.lblUpload;
      document.getElementById('lblTitle').innerText = t.lblTitle;
      document.getElementById('lblCat').innerText = t.lblCat;
      document.getElementById('lblAddItem').innerText = t.lblAddItem;
      document.getElementById('lblQuote').innerText = t.lblQuote;
      document.getElementById('btnDownload').innerText = t.btnDownload;
      document.getElementById('rDateLabel').innerText = t.dateLabel;
      document.getElementById('rTerminal').innerText = t.terminal;

      const choice = document.getElementById('datasetSelect').value;
      if (document.body.classList.contains('theme-custom')) {
        document.getElementById('rTotalLabel').innerText = t.totalItems;
      } else if (choice === 'spotify') {
        document.getElementById('titleInput').value = t.spotifyTitle;
        document.getElementById('catInput').value = t.spotifyCat;
        document.getElementById('quoteInput').value = t.spotifyQuote;
        document.getElementById('rTotalLabel').innerText = t.totalTime;
      } else {
        document.getElementById('titleInput').value = t.txTitle;
        document.getElementById('catInput').value = t.txCat;
        document.getElementById('quoteInput').value = t.txQuote;
        document.getElementById('rTotalLabel').innerText = t.totalSpent;
      }
      updateReceipt();
    }

    function applyPreset() {
      const lang = document.getElementById('langSelect').value;
      const t = translations[lang];
      const choice = document.getElementById('datasetSelect').value;

      if (choice === 'spotify') {
        document.body.className = 'theme-spotify';
        document.getElementById('titleInput').value = t.spotifyTitle;
        document.getElementById('catInput').value = t.spotifyCat;
        document.getElementById('quoteInput').value = t.spotifyQuote;
        document.getElementById('rTotalLabel').innerText = t.totalTime;
        document.getElementById('rTotalVal').innerText = "21.6 mins";
        activeItems = [...spotifyData];
      } else {
        document.body.className = 'theme-transactions';
        document.getElementById('titleInput').value = t.txTitle;
        document.getElementById('catInput').value = t.txCat;
        document.getElementById('quoteInput').value = t.txQuote;
        document.getElementById('rTotalLabel').innerText = t.totalSpent;
        document.getElementById('rTotalVal').innerText = "₹ 3,570";
        activeItems = [...transactionData];
      }
      renderItems();
      updateReceipt();
    }

    function updateReceipt() {
      document.getElementById('rTitle').innerText = document.getElementById('titleInput').value.toUpperCase();
      document.getElementById('rCat').innerText = document.getElementById('catInput').value;
      document.getElementById('rQuote').innerText = document.getElementById('quoteInput').value;
    }

    function handleCSV(event) {
      const file = event.target.files[0];
      if (!file) return;

      const lang = document.getElementById('langSelect').value;
      const t = translations[lang];

      Papa.parse(file, {
        header: true,
        dynamicTyping: true,
        complete: function(res) {
          const rows = res.data.filter(r => Object.keys(r).length > 1).slice(0, 7);
          const items = [];
          rows.forEach(r => {
            const keys = Object.keys(r);
            const nameKey = keys.find(k => /track|name|item|category/i.test(k)) || keys[0];
            const valKey = keys.find(k => /amount|cost|time|duration|score|played/i.test(k)) || keys[1];
            if (r[nameKey]) {
              items.push({
                name: String(r[nameKey]).substring(0, 22),
                val: r[valKey] ? String(r[valKey]).substring(0, 10) : "1x"
              });
            }
          });

          if (items.length > 0) {
            document.body.className = 'theme-custom';
            document.getElementById('titleInput').value = file.name.replace('.csv', '').toUpperCase().substring(0, 18);
            document.getElementById('catInput').value = "Uploaded CSV Data";
            document.getElementById('rTotalLabel').innerText = t.totalItems;
            document.getElementById('rTotalVal').innerText = items.length + " logged";
            activeItems = items;
            renderItems();
            updateReceipt();
          }
        }
      });
    }

    function downloadReceipt() {
      const sound = document.getElementById('printSound');
      if (sound) {
        sound.play().catch(e => {});
      }
      const card = document.getElementById('receiptCard');
      html2canvas(card, { scale: 2, backgroundColor: null }).then(canvas => {
        const a = document.createElement('a');
        a.download = 'life-receipt.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
      });
    }

    applyPreset();
  </script>
</body>
</html>
